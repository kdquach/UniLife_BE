name: Deploy UniLife Backend

on:
  push:
    branches: [main] # Tự động chạy khi bạn push code lên nhánh main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/UniLife_BE
            git pull origin main
            npm install --production
            pm2 restart unilife-be
